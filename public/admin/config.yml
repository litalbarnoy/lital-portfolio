backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "product_design_he"
    label: "עיצוב UX — עברית"
    label_singular: "פרויקט UX"
    folder: "src/content/product-design/he"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    fields:
      - { label: "כותרת", name: "title", widget: "string" }
      - { label: "כותרת משנה", name: "subtitle", widget: "string" }
      - { label: "תפקיד", name: "role", widget: "string" }
      - { label: "לקוח", name: "client", widget: "string" }
      - { label: "שנה", name: "year", widget: "number", value_type: "int" }
      - { label: "תגיות", name: "tags", widget: "list" }
      - label: "תמונת כיסוי (יחס רוחב-גובה מומלץ 16:10)"
        name: "cover"
        widget: "image"
      - label: "גלריית תמונות (יחס מומלץ 4:3)"
        name: "gallery"
        widget: "list"
        field: { label: "תמונה", name: "image", widget: "image" }
      - label: "וידאו (קישור YouTube — לא חובה)"
        name: "video"
        widget: "string"
        required: false
      - label: "סדר הצגה ברשימה (מספר קטן = מוצג ראשון)"
        name: "order"
        widget: "number"
        value_type: "int"
      - label: "תוכן העמוד (האתגר / התהליך / הפתרון / תוצאות)"
        name: "body"
        widget: "markdown"

  - name: "product_design_en"
    label: "Product Design — English"
    label_singular: "Product Design Project"
    folder: "src/content/product-design/en"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Client", name: "client", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Tags", name: "tags", widget: "list" }
      - label: "Cover image (recommended ratio 16:10)"
        name: "cover"
        widget: "image"
      - label: "Gallery images (recommended ratio 4:3)"
        name: "gallery"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }
      - label: "Video (YouTube link — optional)"
        name: "video"
        widget: "string"
        required: false
      - label: "Display order (lower number = shown first)"
        name: "order"
        widget: "number"
        value_type: "int"
      - label: "Page content (Challenge / Process / Solution / Results)"
        name: "body"
        widget: "markdown"

  - name: "curatorial_he"
    label: "אוצרות — עברית"
    label_singular: "פרויקט אוצרות"
    folder: "src/content/curatorial/he"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    fields:
      - { label: "כותרת", name: "title", widget: "string" }
      - { label: "כותרת משנה", name: "subtitle", widget: "string" }
      - { label: "תפקיד", name: "role", widget: "string" }
      - { label: "לקוח / מוסד", name: "client", widget: "string" }
      - { label: "שנה", name: "year", widget: "number", value_type: "int" }
      - { label: "תגיות", name: "tags", widget: "list" }
      - label: "תמונת כיסוי (יחס רוחב-גובה מומלץ 16:10)"
        name: "cover"
        widget: "image"
      - label: "גלריית תמונות (יחס מומלץ 4:3)"
        name: "gallery"
        widget: "list"
        field: { label: "תמונה", name: "image", widget: "image" }
      - label: "וידאו (קישור YouTube — לא חובה)"
        name: "video"
        widget: "string"
        required: false
      - label: "סדר הצגה ברשימה (מספר קטן = מוצג ראשון)"
        name: "order"
        widget: "number"
        value_type: "int"
      - label: "תוכן העמוד (הרעיון / התהליך / התוצאה / הדים)"
        name: "body"
        widget: "markdown"

  - name: "curatorial_en"
    label: "Curatorial — English"
    label_singular: "Curatorial Project"
    folder: "src/content/curatorial/en"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Client / Institution", name: "client", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Tags", name: "tags", widget: "list" }
      - label: "Cover image (recommended ratio 16:10)"
        name: "cover"
        widget: "image"
      - label: "Gallery images (recommended ratio 4:3)"
        name: "gallery"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }
      - label: "Video (YouTube link — optional)"
        name: "video"
        widget: "string"
        required: false
      - label: "Display order (lower number = shown first)"
        name: "order"
        widget: "number"
        value_type: "int"
      - label: "Page content (Idea / Process / Result / Reception)"
        name: "body"
        widget: "markdown"

  - name: "academic_he"
    label: "מחקר אקדמי — עברית"
    label_singular: "פריט אקדמי"
    folder: "src/content/academic/he"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    fields:
      - { label: "כותרת", name: "title", widget: "string" }
      - { label: "כותרת משנה", name: "subtitle", widget: "string" }
      - { label: "תפקיד (מחברת / מרצה / תלמידת מחקר...)", name: "role", widget: "string" }
      - { label: "כתב עת / כנס / מוסד", name: "client", widget: "string" }
      - { label: "שנה", name: "year", widget: "number", value_type: "int" }
      - { label: "תגיות", name: "tags", widget: "list", required: false }
      - label: "תמונת כיסוי (לא חובה — רק אם יש דימוי אמיתי)"
        name: "cover"
        widget: "image"
        required: false
      - label: "גלריית תמונות (לא חובה)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "תמונה", name: "image", widget: "image" }
      - label: "סדר הצגה ברשימה (מספר קטן = מוצג ראשון)"
        name: "order"
        widget: "number"
        value_type: "int"
      - label: "תוכן העמוד"
        name: "body"
        widget: "markdown"

  - name: "academic_en"
    label: "Academic Research — English"
    label_singular: "Academic Entry"
    folder: "src/content/academic/en"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string" }
      - { label: "Role (Author / Lecturer / PhD Student...)", name: "role", widget: "string" }
      - { label: "Journal / Conference / Institution", name: "client", widget: "string" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Cover image (optional — only if a real photo exists)"
        name: "cover"
        widget: "image"
        required: false
      - label: "Gallery images (optional)"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }
      - label: "Display order (lower number = shown first)"
        name: "order"
        widget: "number"
        value_type: "int"
      - label: "Page content"
        name: "body"
        widget: "markdown"
